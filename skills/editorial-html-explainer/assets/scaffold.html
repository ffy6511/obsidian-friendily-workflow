<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ikb: { DEFAULT: "#002FA7", bright: "#5B7BFF", ink: "#071033" },
            },
            fontFamily: {
              serif: ['"Iowan Old Style"', "Palatino", "Georgia", "serif"],
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              mono: ['"Maple Mono CN"', '"Maple Mono"', '"Maple Mono NF"', "ui-monospace", "monospace"],
            },
          },
        },
      };
    </script>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      mermaid.initialize({
        startOnLoad: false,
        theme: "neutral",
        securityLevel: "loose",
        flowchart: { curve: "basis", padding: 12 },
      });
      for (const el of document.querySelectorAll(".mermaid")) {
        try {
          await mermaid.run({ nodes: [el] });
        } catch (err) {
          console.error("mermaid render failed", err);
        }
      }
      window.__bindMermaidLightbox?.();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css"
    />
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/languages/yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/languages/bash.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("pre code[class*='language-']").forEach((el) => {
          hljs.highlightElement(el);
        });
      });
    </script>
    <style>
      .seam { stroke-dasharray: 4 4; }
      .leak { stroke: #dc2626; }
      .deep { background: #0f172a; }
      code, pre, .hljs, kbd, samp {
        font-family: "Maple Mono CN", "Maple Mono", "Maple Mono NF", ui-monospace, monospace !important;
        font-feature-settings: "ss01", "cv11";
        font-variant-ligatures: contextual;
      }
      pre code.hljs {
        background: transparent;
        padding: 0;
        font-size: 13px;
        line-height: 1.65;
        color: #e2e8f0;
      }
      .hljs-keyword, .hljs-selector-tag { color: #93c5fd; }
      .hljs-string, .hljs-attr { color: #86efac; }
      .hljs-number, .hljs-literal { color: #fcd34d; }
      .hljs-comment { color: #94a3b8; font-style: italic; }
      .hljs-title, .hljs-title.function_, .hljs-built_in { color: #7dd3fc; }
      .hljs-params, .hljs-variable, .hljs-template-variable { color: #e2e8f0; }
      .hljs-type, .hljs-class .hljs-title { color: #c4b5fd; }
      .hljs-meta, .hljs-meta .hljs-keyword { color: #fda4af; }
      .hljs-symbol, .hljs-bullet { color: #5B7BFF; }
      .mermaid svg { max-width: 100%; height: auto; }
      .mermaid { cursor: zoom-in; }
      .diagram-lb {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        flex-direction: column;
        background: rgb(15 23 42 / 0.45);
        backdrop-filter: blur(4px);
      }
      .diagram-lb.is-open { display: flex; }
      .diagram-lb-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        border-bottom: 1px solid #e7e5e4;
        background: #fff;
        padding: 0.5rem 0.75rem;
      }
      .diagram-lb-bar .group { display: flex; align-items: center; gap: 0.25rem; }
      .diagram-lb-pct {
        min-width: 3.5rem;
        text-align: center;
        font-family: "Maple Mono CN", "Maple Mono", ui-monospace, monospace;
        font-size: 12px;
        color: #737373;
      }
      .diagram-lb-btn {
        display: inline-flex;
        width: 2rem;
        height: 2rem;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 0.375rem;
        background: transparent;
        color: #57534e;
        cursor: pointer;
      }
      .diagram-lb-btn:hover { background: #f5f5f4; color: #1c1917; }
      .diagram-lb-btn:disabled { cursor: not-allowed; opacity: 0.4; }
      .diagram-lb-btn:focus-visible { outline: 2px solid #002FA7; }
      .diagram-lb-stage { position: relative; flex: 1; overflow: auto; }
      .diagram-lb-pad { display: flex; min-height: 100%; min-width: 100%; padding: 1.5rem; }
      .diagram-lb-card {
        margin: auto;
        flex-shrink: 0;
        border: 1px solid #e7e5e4;
        border-radius: 0.5rem;
        background: #fff;
        padding: 1rem;
        box-shadow: 0 10px 30px rgb(15 23 42 / 0.12);
      }
      .diagram-lb-card svg { width: 100%; height: auto; max-width: none; }
      .diagram-lb-hint {
        pointer-events: none;
        position: absolute;
        bottom: 0.75rem;
        left: 50%;
        transform: translateX(-50%);
        border: 1px solid #e7e5e4;
        border-radius: 9999px;
        background: #fff;
        padding: 0.25rem 0.75rem;
        font-family: "Maple Mono CN", "Maple Mono", ui-monospace, monospace;
        font-size: 11px;
        color: #737373;
      }
      html { scroll-behavior: smooth; }
      [id] { scroll-margin-top: 1.25rem; }
      .toc a { text-underline-offset: 3px; }
      .toc a:hover { color: #002FA7; }
      .toc-rail a {
        display: block;
        border-left: 2px solid #e7e5e4;
        padding: 0.28rem 0 0.28rem 0.75rem;
        color: #737373;
        text-decoration: none;
        line-height: 1.35;
      }
      .toc-rail a:hover { color: #002FA7; border-left-color: #94a3b8; }
      .toc-rail a.is-active {
        color: #002FA7;
        border-left-color: #002FA7;
        font-weight: 600;
      }
      .toc-rail .toc-sub a { padding-left: 1.35rem; font-size: 12px; }
    </style>
  </head>
  <body class="bg-stone-50 text-slate-900 font-sans antialiased">
    <main class="mx-auto w-full max-w-5xl px-6 py-12 space-y-16">
      <header class="space-y-6">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <p class="font-mono text-xs uppercase tracking-widest text-slate-500">{{kicker}}</p>
            <h1 class="mt-2 font-serif text-4xl leading-tight tracking-tight text-slate-900">{{title}}</h1>
            <p class="mt-3 max-w-2xl text-lg text-slate-600">{{lede}}</p>
          </div>
          <p class="font-mono text-xs uppercase tracking-wider text-slate-400">{{date}}</p>
        </div>
        <nav class="toc flex flex-wrap gap-x-6 gap-y-2 border-t border-slate-200 pt-4 font-mono text-sm text-slate-600 2xl:hidden">
          <a href="#sec-1" class="underline decoration-slate-300">01</a>
          <a href="#sec-2" class="underline decoration-slate-300">02</a>
        </nav>
      </header>

      <section id="sec-1" class="space-y-10">
        <header class="space-y-3">
          <p class="font-mono text-xs uppercase tracking-widest text-ikb">01</p>
          <h2 class="font-serif text-3xl text-slate-900">{{section}}</h2>
          <p class="max-w-3xl text-slate-700 leading-relaxed">{{prose}}</p>
        </header>
      </section>
    </main>

    <aside class="pointer-events-none fixed inset-y-0 right-0 z-20 hidden w-56 pr-6 pt-12 2xl:block">
      <nav class="toc-rail pointer-events-auto sticky top-8 ml-auto w-44 text-[13px]" aria-label="本页目录">
        <p class="mb-3 font-mono text-[11px] uppercase tracking-widest text-slate-400">本页</p>
        <a href="#sec-1">01 · {{section}}</a>
      </nav>
    </aside>

    <script>
      (function () {
        const links = Array.from(document.querySelectorAll(".toc-rail a"));
        if (!links.length) return;
        const items = links
          .map((a) => {
            const id = (a.getAttribute("href") || "").slice(1);
            const el = document.getElementById(id);
            return el ? { a, el } : null;
          })
          .filter(Boolean);
        const visible = new Set();
        const paint = () => {
          let current = items[0];
          for (const item of items) {
            if (visible.has(item.el)) current = item;
          }
          links.forEach((a) => a.classList.toggle("is-active", a === current.a));
        };
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) visible.add(e.target);
              else visible.delete(e.target);
            });
            paint();
          },
          { rootMargin: "-12% 0px -72% 0px", threshold: 0 }
        );
        items.forEach(({ el }) => io.observe(el));
        paint();
      })();
    </script>
    <script>
      (function () {
        const MIN = 0.25, MAX = 4, STEP = 0.25;
        const icon = (d) =>
          `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
        const I = {
          minus: icon('<circle cx="11" cy="11" r="8"/><path d="M8 11h6"/><path d="m21 21-4.3-4.3"/>'),
          plus: icon('<circle cx="11" cy="11" r="8"/><path d="M11 8v6"/><path d="M8 11h6"/><path d="m21 21-4.3-4.3"/>'),
          reset: icon('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'),
          x: icon('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'),
        };
        let scale = 1, lastFocus = null, lb, card, pct, btnOut, btnIn, btnReset;
        function setScale(next) {
          scale = Math.min(MAX, Math.max(MIN, next));
          card.style.width = `${100 * scale}%`;
          pct.textContent = `${Math.round(scale * 100)}%`;
          btnOut.disabled = scale <= MIN;
          btnIn.disabled = scale >= MAX;
          btnReset.disabled = scale === 1;
        }
        function close() {
          lb.classList.remove("is-open");
          document.body.style.overflow = "";
          setScale(1);
          lastFocus?.focus();
        }
        function open(svgHtml) {
          lastFocus = document.activeElement;
          card.innerHTML = svgHtml;
          setScale(1);
          lb.classList.add("is-open");
          document.body.style.overflow = "hidden";
          lb.querySelector("[data-close]").focus();
        }
        function mountLightbox() {
          lb = document.createElement("div");
          lb.className = "diagram-lb";
          lb.setAttribute("role", "dialog");
          lb.setAttribute("aria-modal", "true");
          lb.setAttribute("aria-label", "放大查看图");
          lb.innerHTML = `
            <div class="diagram-lb-bar">
              <div class="group">
                <button type="button" class="diagram-lb-btn" data-zoom-out aria-label="缩小" title="缩小">${I.minus}</button>
                <span class="diagram-lb-pct" aria-live="polite">100%</span>
                <button type="button" class="diagram-lb-btn" data-zoom-in aria-label="放大" title="放大">${I.plus}</button>
                <button type="button" class="diagram-lb-btn" data-reset aria-label="重置缩放" title="重置缩放">${I.reset}</button>
              </div>
              <button type="button" class="diagram-lb-btn" data-close aria-label="关闭" title="关闭">${I.x}</button>
            </div>
            <div class="diagram-lb-stage" data-stage>
              <div class="diagram-lb-pad" data-stage>
                <div class="diagram-lb-card" data-card></div>
              </div>
              <div class="diagram-lb-hint">滚动查看 · Esc 关闭 · +/- 缩放</div>
            </div>`;
          document.body.appendChild(lb);
          card = lb.querySelector("[data-card]");
          pct = lb.querySelector(".diagram-lb-pct");
          btnOut = lb.querySelector("[data-zoom-out]");
          btnIn = lb.querySelector("[data-zoom-in]");
          btnReset = lb.querySelector("[data-reset]");
          lb.querySelector("[data-close]").addEventListener("click", close);
          btnOut.addEventListener("click", () => setScale(scale - STEP));
          btnIn.addEventListener("click", () => setScale(scale + STEP));
          btnReset.addEventListener("click", () => setScale(1));
          lb.querySelectorAll("[data-stage]").forEach((el) => {
            el.addEventListener("click", (e) => {
              if (e.target === el) close();
            });
          });
          window.addEventListener("keydown", (e) => {
            if (!lb.classList.contains("is-open")) return;
            if (e.key === "Escape") { e.preventDefault(); close(); }
            else if (e.key === "+" || e.key === "=") { e.preventDefault(); setScale(scale + STEP); }
            else if (e.key === "-" || e.key === "_") { e.preventDefault(); setScale(scale - STEP); }
            else if (e.key === "0") { e.preventDefault(); setScale(1); }
          });
        }
        window.__bindMermaidLightbox = function () {
          if (!lb) mountLightbox();
          document.querySelectorAll(".mermaid").forEach((node) => {
            node.setAttribute("title", "点击放大查看");
            node.setAttribute("role", "button");
            node.tabIndex = 0;
            if (node.dataset.zoomBound) return;
            node.dataset.zoomBound = "1";
            const show = () => {
              const svg = node.querySelector("svg");
              if (svg) open(svg.outerHTML);
            };
            node.addEventListener("click", show);
            node.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                show();
              }
            });
          });
        };
        if (document.querySelector(".mermaid svg")) window.__bindMermaidLightbox();
      })();
    </script>
  </body>
</html>
